# 语音指令：一行一句，不改 ASR 模型。修改后重启 Harness（面板：停止所有→启动所有）。
# 私人用词：复制此文件为 voice_commands.local.yaml 再改，local 文件不上传 Git。
# 短句：现有路由会容忍部分礼貌词、语气词和识别重复；不是任意子串匹配。
# 句中关键词：整句话中出现就触发，包括否定/引用句，请谨慎设置。
# 匹配句式：高级正则表达式；找物必须保留 (?P<target>...) 以提取物品名。
# [] 表示关闭该类匹配；删除字段表示沿用默认。控制指令优先级保持原样。
控制指令:
  暂停:
    短句:
    - 停一下
    - 同一下
    - 等一下
    - 等一一下
    - 别说了
    - 闭嘴
    - 停止播报
    - 安静
    - 暂停对话
    - 暂停
    句中关键词:
    - 停一下
  恢复:
    句中关键词:
    - 恢复对话
  重新开始:
    短句:
    - 重新开始
    句中关键词:
    - 重新开始
  回到聊天:
    短句:
    - 回到聊天
    - 回到普通聊天
    - 退出技能
    - 普通聊天
    - 恢复普通聊天
  取消任务:
    短句:
    - 取消任务
    - 不找了
    - 不读了
技能指令:
  普通聊天:
    触发短句:
    - 普通聊天
    - 回到聊天
  找物:
    匹配句式:
    - 帮我找(?:一下)?(?:我的)?(?P<target>.+)
    - 帮我找(?P<target>.+)
    - (?P<target>.+)在哪
    - (?P<target>.+)在哪里
    - 看到(?P<target>.+)了吗
    - 有没有(?P<target>.+)
  读文字:
    触发短句:
    - 读一下
    - 念一下
    - 帮我读一下
    - 帮我识字
    - 帮我读字
    - 上面写了什么
    - 这是什么字
    - 读文字
  描述场景:
    触发短句:
    - 描述一下
    - 帮我描述一下
    - 帮我描述场景
    - 前面有什么
    - 看看周围
    - 画面里有什么
  室内领路:
    触发短句:
    - 帮我避障
    - 前面有障碍吗
    - 前面有没有障碍
    - 看一下前方障碍
    - 前面安全吗
